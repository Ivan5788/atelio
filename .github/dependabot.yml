# 依賴更新（docs/05-security.md C-13）：每週檢查一次 npm 與 GitHub Actions 的新版本並開 PR。
# 次要與修補版本合併成一個 PR，減少雜訊；主版本更新分開，需要人工評估相容性。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 改寫了編譯器 API，vue-tsc（nuxt typecheck）尚未支援，升級會讓型別檢查失敗。
      # 鎖定在 6.x，等 vue-tsc 支援後移除這條規則。
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
